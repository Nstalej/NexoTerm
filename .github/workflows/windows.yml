name: Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run vendor
      - run: npm test
      - run: npm run build
      - run: npm run test:e2e
      - run: npm audit --omit=dev
      - run: npm run dist
      - name: Checksums
        shell: pwsh
        run: Get-ChildItem release/*.exe | ForEach-Object { $h = Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256; "$($h.Hash.ToLower())  $($_.Name)" } | Set-Content release/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: NexoTerm-Windows-x64
          path: |
            release/*.exe
            release/SHA256SUMS.txt
  draft-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: NexoTerm-Windows-x64
          path: release
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release already exists; preserving its reviewed assets and notes."
          else
            gh release create "$TAG_NAME" release/*.exe release/SHA256SUMS.txt --draft --title "NexoTerm $TAG_NAME" --notes-file CHANGELOG.md
          fi
